{% extends 'base.html' %}
{% load static %}

{% block content %}
{% include 'includes/vendor_cover.html' %}

<div class="container">
    <h2>Vendor Profile</h2>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <h3>Vendor Details</h3>
        {{ vendor_form.as_p }}

        <hr>

        <h3>User Profile</h3>
        {{ profile_form.as_p }}

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>

{% endblock %}
