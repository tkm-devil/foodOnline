{% extends "base.html" %}
{% block content %}

<!-- Include the cover section -->
{% include 'includes/vendor_cover.html' %}

<div class="back-to-dashboard">
    <a href="{% url 'vendorDashboard' %}" class="btn btn-primary">
        <i class="icon-arrow-left"></i> Back to Dashboard
    </a>
</div>

<div class="container mt-5">
    <h2 class="mb-4">Vendor Earnings</h2>

    <div class="card p-4">
        <h4>Total Earnings: ₹{{ earnings.total_earnings }}</h4>
        <h5>Last Payment: ₹{{ earnings.last_payment }}</h5>
        <h6>Last Payment Date: {{ earnings.last_payment_date|default:"N/A" }}</h6>
    </div>
</div>
{% endblock %}
