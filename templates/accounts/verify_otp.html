{% extends 'base.html' %}

{% block content %}

<!-- Main Section Start -->
<style>
    .btn-primary {
        color: #fff;
        background-color: #c33332;
        border-color: #c33332;
    }
</style>

<div class="main-section">
    <div class="page-section nopadding cs-nomargin" style="margin-top: 0px; padding-top: 60px; padding-bottom: 60px; margin-bottom: 0px;">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="user-dashboard loader-holder">
                        <div class="user-holder">
                            <h4 class="text-center" style="margin-bottom: 0;">EMAIL VERIFICATION</h4>
                            <p class="text-center">Enter the OTP sent to your registered email to verify your account.</p>
                            <hr>

                            <!-- Display Django Messages -->
                            {% include 'includes/alerts.html' %}

                            <div id="otp-verification-form">
                                <form id="otp-form" method="POST">
                                    {% csrf_token %}

                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="form-group">
                                                <label for="otp">Enter OTP</label>
                                                <input type="text" id="otp" name="otp" class="form-control" placeholder="Enter 6-digit OTP" required>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-center">
                                        <button type="submit" id="btn-verify-otp" class="btn btn-primary w-100">
                                            Verify OTP <span id="spinner-otp" class="spinner-border spinner-border-sm d-none"></span>
                                        </button>
                                    </div>                                    
                                    
                                    <div class="text-center mt-3">
                                        <p>Didn’t receive the OTP? <a href="{% url 'registerUser' %}" class="text-primary">Resend OTP</a></p>
                                    </div>
                                </form>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById("btn-verify-otp").addEventListener("click", function() {
        document.getElementById("spinner-otp").classList.remove("d-none");
    });

    document.getElementById("otp-form").addEventListener("submit", function(event) {
        event.preventDefault();
        let otp = document.getElementById("otp").value;
        let email = "{{ request.session.email }}";

        fetch("{% url 'verify_otp_view' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({ email: email, otp: otp })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                alert(data.message);
                window.location.href = "{% url 'login_view' %}";
            } else if (data.error) {
                alert(data.error);
            }
        })
        .catch(error => console.error("Error:", error));
    });
</script>

{% endblock %}
